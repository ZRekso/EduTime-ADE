<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="IMG/favicon-edutime.svg">
    <link rel="apple-touch-icon" href="IMG/LOGO.png">   
    <title>EduTime</title>
</head>
<body>
    <header>
        <p class="semaine">   </p>
        <p id="dateADJ" class="txt-dateADJ"></p>
    </header>

    <!-- voir pour afficher le prochain cour -->
    <section id="NextCour">
        <div class="container-etatCour">
            <p class="txtProchainCour"></p>
            <p class="salle"></p>
        </div>
        <p class="nomCour">Chargement...</p>
        <div id="infoProchainCour" class="loading">
            <div class="StyleInfoProchainCour">
                <p class="setting professeur"></p>
                <p id="removeS" class="setting">•</p>
                <p id="removeHD" class="setting heureDebut"></p>
                <p id="removeT" class="setting">-</p>
                <p id="removeHF" class="setting heureFin"></p>
            </div>
            <div id="removeBarre" class="barre"><div class="barre-remplie"></div></div>
            <div id="removeHBarre" class="containerHeureBarre">
                <p class="setting barreDebut"></p>
                <p class="setting barreFin"></p>
            </div>
            <hr id="hrProchain" class="remove">
            <div id="containerStatusNbTemps" class="remove">
                <p class="status"></p>
                <p class="nbTemps"></p>
            </div>
        </div>
    </section>

    <section id="journee">
        <div class="containerInfo">
            <p class="txtJournee">Ta journée</p>
            <p class="nbCourADJ"></p>
        </div>
        <div class="barreJournee"><div class="barreJournee-remplie"></div></div>
        <div class="containerHeureJournee">
            <p class="heureDebutJournee"></p>
            <p class="heureFinJournee"></p>
        </div>
    </section>

    <section>
        <p></p> <!-- TODO -->
    </section>

    <!-- Voir pour afficher edt recup avec JS -->

        <div class="emploiDuJour">
            <div class="emploiHeader">
                <span class="ADJSpan">Aujourd'hui</span>
                <p class="week"></p>
            </div>
        </div>
    </section>

    <!-- btn acceuil, semaine, reglage, (option NOTIFICATION quand il y a un cour qui a etait annule ou modifier, ou les FUTUR DS )-->
